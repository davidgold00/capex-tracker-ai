[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capex-tracker-ai"
version = "0.1.0"
description = "Tracks hyperscaler AI infrastructure capex and its squeeze on cash flow, from SEC EDGAR XBRL data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "matplotlib==3.11.2",
    "pandas==3.1.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.setuptools.package-data]
"capex_tracker.guidance" = ["prompts/*.txt"]
