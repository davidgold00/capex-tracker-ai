name: Update data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/guidance/pending.csv
      - data/guidance/audit_sample.csv

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Refresh SEC financials and incremental guidance
        if: github.event_name != 'push'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m capex_tracker.guidance.weekly
          python -m capex_tracker update --refresh
      - name: Apply browser decisions and refresh findings
        if: github.event_name == 'push'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m capex_tracker.guidance.weekly --decisions-only
          python scripts/audit_sample.py
          python -m capex_tracker readme
      - name: Commit verified data
        run: |
          git add data/processed data/guidance docs/charts README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh SEC evidence and reviewed findings"
            python scripts/check_push_privacy.py
            git push origin HEAD:main
          fi
      - name: Synchronize guidance review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_push_privacy.py
          python scripts/review_issue.py
